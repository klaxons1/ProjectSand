plugins {
    id 'com.android.application'
}

android {
    namespace 'smellymoo.sand'
    compileSdk 34

    defaultConfig {
        applicationId "smellymoo.sand"
        minSdk 10
        targetSdk 34
        versionCode 86
        versionName "0.86"
        ndk {
            abiFilters 'arm64-v8a'
        }
        // externalNativeBuild removed – using prebuilt jniLibs (original via REA) + stub cpp for reference
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    // externalNativeBuild disabled – prebuilt libsand in jniLibs (see docs/lib -> jniLibs) + stub in cpp/sand_engine.cpp via REA

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
